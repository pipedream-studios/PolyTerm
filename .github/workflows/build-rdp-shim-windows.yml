name: Build RDP shim (Windows)

# Manual-only, not on every push (mirrors portable-macos's own "expensive/exploratory, opt-in"
# precedent in ci.yml). This proves native/PolyTerm-rdp-shim actually compiles for Windows via vcpkg
# (issue #84) ahead of wiring it into the shipping app - the Linux/macOS side already builds via
# apt-installed FreeRDP dev packages (see the portable-ubuntu job), but Windows has no equivalent
# system package manager, so vcpkg (pre-installed on GitHub's windows-latest runners) stands in for
# that role here. Once this is proven and wired into packaging/windows/build-rdp-shim.ps1 (issue #84
# phase B), this workflow becomes redundant with ci.yml's own windows job and can be retired - it
# exists for now purely to iterate on getting the vcpkg-based build working without burning full
# solution build time on every attempt.
on:
  workflow_dispatch:

jobs:
  build-shim:
    name: Build native RDP shim (windows-latest, vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Authenticates vcpkg's GitHub Actions Cache binary-caching backend (x-gha) so repeated runs
      # of this workflow don't rebuild FreeRDP and its whole dependency tree (openssl/zlib/cjson/...)
      # from source every single time - only the first run (and any run after a vcpkg version bump)
      # pays that cost.
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure (vcpkg manifest mode via the runner's pre-installed vcpkg)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --build native/PolyTerm-rdp-shim/build --config Release

      # freerdp-client3.dll/winpr3.dll and their own runtime deps (openssl/zlib/cjson/...) all land in
      # vcpkg's own installed/bin dir under the dynamic x64-windows triplet - the shim DLL alone isn't
      # loadable without them sitting alongside it.
      - name: Stage shim + runtime dependencies
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item native/PolyTerm-rdp-shim/build/Release/polyterm_rdp_shim.dll stage/
          Copy-Item native/PolyTerm-rdp-shim/build/vcpkg_installed/x64-windows/bin/*.dll stage/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyterm-rdp-shim-windows-x64
          path: stage/*.dll
