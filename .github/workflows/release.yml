name: Release

# Tag push (v0.9.0 etc.) builds real release artifacts and attaches them to a GitHub Release.
# workflow_dispatch lets you run the exact same pipeline by hand first, before ever pushing a tag -
# it builds and uploads a build artifact but skips the "create a GitHub Release" step (gated on
# github.ref_type == 'tag' below), so a manual run can't accidentally publish anything.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write # only the "publish" job needs this, to create/attach to a GitHub Release

jobs:
  # Reruns the exact same build+test CI already does on every push. Deliberately not just trusting
  # that ci.yml already passed for this commit - GitHub doesn't guarantee that workflow ordering, and
  # a release pipeline is exactly the place NOT to assume. Nothing below this job runs if it fails.
  test:
    name: Build & test (windows-latest, full solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore PolyTerm.slnx
      - run: dotnet build PolyTerm.slnx -c Release --no-restore
      # See ci.yml for why PolyTerm.FlaUI.Tests is no longer filtered out of this run.
      - run: dotnet test PolyTerm.slnx -c Release --no-restore --no-build

  windows-portable-zip:
    name: Build Windows portable zip
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Builds native/PolyTerm-rdp-shim (issue #67/#84) via vcpkg so the portable zip actually ships
      # with working RDP, not just the "capability-gated, pack-optional" greyed-out fallback - proven
      # working in build-rdp-shim-windows.yml (issue #84 phase A) before being wired in here. Must run
      # before dotnet publish below: PolyTerm.Protocols.RdpFreerdp.csproj only copies
      # polyterm_rdp_shim.dll (+ its vcpkg runtime deps) into the publish output when it finds them
      # already built at native/PolyTerm-rdp-shim/build - see that project's own MSBuild conditions.
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure native RDP shim (vcpkg manifest mode via the runner's pre-installed vcpkg)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build native RDP shim
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --build native/PolyTerm-rdp-shim/build --config Release

      - name: Read version from Directory.Build.props
        id: version
        run: |
          $version = dotnet msbuild src/PolyTerm.App/PolyTerm.App.csproj -getProperty:Version -nologo
          "version=$version" >> $env:GITHUB_OUTPUT

      # Catches the classic "tagged a release without bumping Directory.Build.props first" mistake
      # before it ships a wrongly-versioned artifact - a tag of v0.9.0 must build a Version of 0.9.0.
      - name: Verify tag matches the built version
        if: github.ref_type == 'tag'
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $builtVersion = "${{ steps.version.outputs.version }}"
          if ($tagVersion -ne $builtVersion) {
            throw "Tag '${{ github.ref_name }}' implies version '$tagVersion' but Directory.Build.props has '$builtVersion' - bump the version before tagging."
          }

      - name: Build portable zip (App + CLI, self-contained win-x64)
        run: ./packaging/windows/build-portable-zip.ps1 -SmokeTest

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PolyTerm-${{ steps.version.outputs.version }}-win-x64
          path: packaging/windows/publish/win-x64/PolyTerm-*.zip

  # WiX Toolset v7's "Open Source Maintenance Fee" EULA is accepted via `wix eula accept wix7`
  # inside build-msi.ps1 itself (see that script's own doc comment for the full reasoning - reviewed
  # explicitly with the user on 2026-07-09, not a default to copy elsewhere without the same
  # conversation). $10/month, waived under $10k/yr revenue from the software.
  windows-msi:
    name: Build Windows MSI
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install the wix CLI
        run: dotnet tool install --global wix

      # See the windows-portable-zip job's own comment for why this has to run before dotnet publish.
      - uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure native RDP shim (vcpkg manifest mode via the runner's pre-installed vcpkg)
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build native RDP shim
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --build native/PolyTerm-rdp-shim/build --config Release

      - name: Read version from Directory.Build.props
        id: version
        run: |
          $version = dotnet msbuild src/PolyTerm.App/PolyTerm.App.csproj -getProperty:Version -nologo
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSI (App + CLI, self-contained win-x64)
        run: ./packaging/windows/build-msi.ps1 -SmokeTest

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PolyTerm-${{ steps.version.outputs.version }}-win-x64-msi
          path: packaging/windows/publish/msi/PolyTerm-*.msi

  # Linux portable tarball (issue #72) - the Linux counterpart to windows-portable-zip above, first
  # packaging deliverable for that issue's own "start with the cheapest first step" phasing. macOS
  # (.dmg) is deliberately not here - being handled separately by the project owner outside the ticket
  # system (see issue #87/#88's own scope notes for why macOS work in this repo is currently
  # cordoned off that way).
  linux-portable-tarball:
    name: Build Linux portable tarball
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Same reasoning as the portable-ubuntu job in ci.yml: builds native/PolyTerm-rdp-shim against
      # apt-installed FreeRDP dev packages (no vcpkg needed here, unlike Windows) so the tarball ships
      # with working RDP instead of the greyed-out fallback - must run before dotnet publish, same as
      # the Windows jobs' own vcpkg build (see windows-portable-zip's own comment for why). xvfb is for
      # build-portable-tarball.sh's own -SmokeTest, which needs a real (virtual) display to launch the
      # actual Avalonia GUI app, not just check the file exists.
      - name: Install native shim build dependencies + xvfb
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential cmake libfreerdp3-dev libwinpr3-dev zlib1g-dev xvfb

      - name: Build native RDP shim
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build
          cmake --build native/PolyTerm-rdp-shim/build

      - name: Read version from Directory.Build.props
        id: version
        run: |
          version=$(dotnet msbuild src/PolyTerm.App/PolyTerm.App.csproj -getProperty:Version -nologo)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same check as windows-portable-zip's own "Verify tag matches the built version" step.
      - name: Verify tag matches the built version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          built_version="${{ steps.version.outputs.version }}"
          if [ "$tag_version" != "$built_version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' implies version '$tag_version' but Directory.Build.props has '$built_version' - bump the version before tagging." >&2
            exit 1
          fi

      - name: Build portable tarball (App + CLI, self-contained linux-x64)
        run: ./packaging/linux/build-portable-tarball.sh --rid linux-x64 --smoke-test

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PolyTerm-${{ steps.version.outputs.version }}-linux-x64
          path: packaging/linux/publish/linux-x64/PolyTerm-*.tar.gz

  # Only runs for a real tag push (workflow_dispatch runs stop after the build/upload-artifact steps
  # above, so testing this pipeline by hand can never accidentally create a public release).
  publish-release:
    name: Publish GitHub Release
    needs: [windows-portable-zip, windows-msi, linux-portable-tarball]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PolyTerm-${{ needs.windows-portable-zip.outputs.version }}-win-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: PolyTerm-${{ needs.windows-msi.outputs.version }}-win-x64-msi
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: PolyTerm-${{ needs.linux-portable-tarball.outputs.version }}-linux-x64
          path: dist

      - name: Create release and attach the zip + MSI + tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            dist/*.msi \
            dist/*.tar.gz \
            --title "PolyTerm ${{ github.ref_name }}" \
            --generate-notes \
            --repo "${{ github.repository }}"
