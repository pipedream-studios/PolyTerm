name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Full solution — everything, including the Windows-only App/Rdp/FlaUI.Tests projects (WinForms/COM
  # interop, MSTSC ActiveX, real UI automation). This is the only leg that can build/test the whole
  # thing; the other two use PolyTerm.Portable.slnx (see its own comment for exactly what's excluded
  # and why).
  windows:
    name: Build & test (windows-latest, full solution)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PolyTerm.slnx

      - name: Build
        run: dotnet build PolyTerm.slnx -c Release --no-restore

      # PolyTerm.FlaUI.Tests is compiled above (catches real regressions) but excluded from the run:
      # it drives real OS window focus/keyboard input against a live PolyTerm.exe, which is reliably
      # flaky under concurrent load — confirmed locally (passes in isolation, fails when other work is
      # happening on the same desktop session) and a well-known category of unreliability for
      # UI-automation tests on CI runners generally, not a PolyTerm-specific issue. Real synthetic
      # mouse clicks are also a confirmed, deeper gap in this project — see docs/todos.md's FlaUI
      # section — so this project's value today is local manual verification, not CI gating.
      # No explicit LogFileName: each project in the solution is a separate VSTest run, and a fixed
      # name would have every later project's results overwrite the earlier ones — confirmed locally
      # (only the last of 7 .trx files survived with a fixed name; VSTest's own default naming, which
      # includes a timestamp, produces one distinct file per project instead).
      - name: Test
        run: dotnet test PolyTerm.slnx -c Release --no-restore --no-build --filter "FullyQualifiedName!~PolyTerm.FlaUI.Tests" --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: TestResults/*.trx

  # Cross-platform subset — proves PolyTerm.Cli/Engine/the protocol modules (everything except the
  # desktop App itself) actually build and pass their tests on Linux/macOS too, matching the spec's
  # "PolyTerm.Cli can open an SSH session with the App uninstalled" portability litmus test.
  portable:
    name: Build & test (${{ matrix.os }}, portable subset)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore PolyTerm.Portable.slnx

      - name: Build
        run: dotnet build PolyTerm.Portable.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PolyTerm.Portable.slnx -c Release --no-restore --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
