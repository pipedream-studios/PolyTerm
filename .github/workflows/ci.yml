name: CI

# Deliberately no `push: branches: [main]` trigger: every commit that lands on main got there via a
# squash-merged PR, so it already ran this exact workflow (content-identical) as the PR's own check -
# a push-triggered re-run would just burn a second full run of the minute budget for nothing new. If
# this repo ever allows direct pushes to main (bypassing a PR), that gap would need revisiting.
on:
  pull_request:
    branches: [main]
  # Weekly, not per-PR: the actual cross-platform-breakage risk this catches (the portable subset -
  # PolyTerm.Cli/Engine/protocol modules, no platform-specific code paths) is macOS behaving
  # differently from Linux specifically, which is rare for this codebase - see the portable job's own
  # comment. Runs macos-latest too (see that job's `if:`), which is why this isn't on every PR: macOS
  # runners bill Actions minutes at 10x wall-clock time, by far the most expensive line item in this
  # whole pipeline per minute of actual work.
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

# Cancels a still-running CI run for the same PR/ref the moment a newer one starts (e.g. a second
# push before the first run finished) - the superseded run's result was never going to be looked at,
# so there's no reason to let it keep burning minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full solution — everything, including the Windows-only FlaUI.Tests project (real UI automation).
  # This is the only leg that can build/test the whole thing; the other two use PolyTerm.Portable.slnx
  # (see its own comment for exactly what's excluded and why).
  windows:
    name: Build & test (windows-latest, full solution)
    runs-on: windows-latest
    # Healthy runs finish in ~6-7 minutes (FlaUI.Tests' real UI automation is the slow part, ~2-3 of
    # that). No timeout here defaults to GitHub's own 360-minute cap - fine for cost on GitHub-hosted
    # infra billed by the minute, but this repo runs on a free-tier minute budget, so a single genuinely
    # hung test (confirmed possible: a test that awaits a signal it can only fail to receive, with no
    # fallback cancellation) can silently burn hours before anyone notices. 20 minutes gives ~3x margin
    # over the slowest normal run while capping the damage from a real hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PolyTerm.slnx

      - name: Build
        run: dotnet build PolyTerm.slnx -c Release --no-restore

      # PolyTerm.FlaUI.Tests.KeyboardDiagnosticTests used to be excluded from this run: it drives real
      # OS window focus/keyboard input against a live PolyTerm.exe, and was flaky specifically as part
      # of the full local suite (passed in isolation). Root-caused: PolyTermAppFixture.Dispose() didn't
      # wait for the previous test class's PolyTerm.exe to actually exit before returning, so the next
      # class's fixture could launch and force its own window to the foreground while the previous
      # process/window-close animation was still settling, racing this test's own foreground-forcing.
      # Fixed by waiting for real process exit in Dispose() and reasserting+retrying foreground/typing
      # in the test itself — verified locally with 10 consecutive clean full-suite runs (see
      # https://github.com/chris3081/PolyTerm/issues/3 for the full investigation, including one dead
      # end: simulating an Alt keypress to reset Windows' foreground-lock timeout, which broke this app
      # specifically by triggering a native menu mnemonic). Re-enabled here; if this still flakes on a
      # real GitHub-hosted runner (a materially different environment from local dev), that's the next
      # thing to check — UI-automation tests are a known-harder category on CI generally.
      # No explicit LogFileName: each project in the solution is a separate VSTest run, and a fixed
      # name would have every later project's results overwrite the earlier ones — confirmed locally
      # (only the last of 7 .trx files survived with a fixed name; VSTest's own default naming, which
      # includes a timestamp, produces one distinct file per project instead).
      #
      # VncPixelFormatTests re-enabled here (issue #22) after a real fix to FakeRfbServer's drain
      # step (see its own updated comment) — trying this on a real CI run is the only way to actually
      # confirm it, per the issue's own history of inference-from-log-timing-alone going nowhere.
      - name: Test
        run: dotnet test PolyTerm.slnx -c Release --no-restore --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/*.trx

  # Cross-platform subset — proves PolyTerm.Cli/Engine/the protocol modules (everything except the
  # desktop App itself) actually build and pass their tests on Linux/macOS too, matching the spec's
  # "PolyTerm.Cli can open an SSH session with the App uninstalled" portability litmus test.
  #
  # Split into two jobs, not one matrix job, deliberately: a job-level `if:` can't reference `matrix`
  # (that context only exists within steps, after matrix expansion for that specific combination) -
  # confirmed the hard way, this repo's very first real CI run after re-enabling Actions failed with
  # "Invalid workflow file ... Unrecognized named-value: 'matrix'" from exactly that mistake. Two
  # plain single-OS jobs sidestep the problem entirely and are just as easy to read.
  portable-ubuntu:
    name: Build & test (ubuntu-latest, portable subset)
    runs-on: ubuntu-latest
    # Healthy runs finish in ~2-3 minutes including the native RDP shim build - see the windows job's
    # own comment on why an explicit cap matters here (free-tier minute budget, not GitHub's default
    # 360-minute one).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # native/PolyTerm-rdp-shim (issue #67) - the FreeRDP C shim PolyTerm.Protocols.RdpFreerdp binds
      # via P/Invoke. The C# build itself doesn't need this (P/Invoke has no compile-time link
      # dependency), but building it for real here catches shim breakage early instead of only ever
      # finding out on a developer's own machine - it's the newest, riskiest code in this repo (first
      # vendored native library / first P/Invoke-to-a-shared-object). freerdp3-dev/libwinpr3-dev
      # install straight from Ubuntu's own apt repo (FreeRDP 3.5.1) - no need to build FreeRDP itself.
      - name: Install native shim build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential cmake freerdp3-dev libwinpr3-dev zlib1g-dev

      - name: Build native RDP shim
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build
          cmake --build native/PolyTerm-rdp-shim/build

      - name: Restore
        run: dotnet restore PolyTerm.Portable.slnx

      - name: Build
        run: dotnet build PolyTerm.Portable.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PolyTerm.Portable.slnx -c Release --no-restore --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-latest
          path: TestResults/*.trx

  # macos-latest only, on the weekly schedule or a manual workflow_dispatch - not on every PR. It
  # bills Actions minutes at 10x wall-clock time (vs 1x for ubuntu-latest above, 2x for windows-latest
  # below), making it the single most expensive leg in this pipeline per minute of real work despite
  # doing the least. ubuntu-latest already covers "does this build and pass on a non-Windows OS"
  # cheaply on every PR; macOS-specific breakage in a codebase with no platform-specific code paths in
  # this subset is the rare case this weekly run exists to catch eventually, not the common one worth
  # paying for on every push.
  portable-macos:
    name: Build & test (macos-latest, portable subset)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # macOS runners bill at 10x wall-clock (see this job's own comment above on why it isn't on every
    # PR) - a hang here is the single most expensive way this pipeline could burn the minute budget, so
    # this cap matters even more than the other two jobs'.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # native/PolyTerm-pty-shim - a fixed-arity C wrapper around ioctl(TIOCSWINSZ), needed because
      # calling that real (variadic-in-libc) function directly via .NET P/Invoke is unreliable on
      # Apple Silicon's ABI - see UnixPtyTerminal.Resize()'s own doc comment for the full story.
      # cmake and a C compiler (Xcode Command Line Tools) are preinstalled on macos-latest runners, no
      # separate install step needed here unlike portable-ubuntu's FreeRDP dependencies.
      - name: Build native PTY shim
        run: |
          cmake -S native/PolyTerm-pty-shim -B native/PolyTerm-pty-shim/build
          cmake --build native/PolyTerm-pty-shim/build

      - name: Restore
        run: dotnet restore PolyTerm.Portable.slnx

      - name: Build
        run: dotnet build PolyTerm.Portable.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PolyTerm.Portable.slnx -c Release --no-restore --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-latest
          path: TestResults/*.trx
