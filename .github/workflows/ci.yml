name: CI

# Deliberately no `push: branches: [main]` trigger: every commit that lands on main got there via a
# squash-merged PR, so it already ran this exact workflow (content-identical) as the PR's own check -
# a push-triggered re-run would just burn a second full run of the minute budget for nothing new. If
# this repo ever allows direct pushes to main (bypassing a PR), that gap would need revisiting.
on:
  pull_request:
    branches: [main]
    # `closed` is here only to cancel the PR's in-flight run: it joins the same concurrency group
    # below, which cancels whatever is running or queued there, and every job skips itself for it
    # (see the `if:`s), so it never takes a runner. Without it a closed or superseded PR - Dependabot
    # closes plenty - keeps its run going and holds runners for nothing (#267).
    types: [opened, synchronize, reopened, closed]
    # Docs-only PRs skip CI: nothing here is a build or test input. A PR is only skipped when every
    # changed file matches, so docs + code still runs. Safe while main has no required status
    # checks; if CI becomes required, a skipped workflow leaves the check pending forever - switch to
    # a job-level path filter with an always-run summary job then (issue #209).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      # Read only by GitHub's Dependabot service, which validates it itself when it reaches main.
      - ".github/dependabot.yml"
  # Weekly safety net on top of the per-PR runs, catching breakage from things that change without a
  # commit here (runner images, apt's FreeRDP, NuGet floating versions).
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

# Cancels a still-running CI run for the same PR/ref the moment a newer one starts (e.g. a second
# push before the first run finished) - the superseded run's result was never going to be looked at,
# so there's no reason to let it keep burning minutes to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full solution — everything, including the Windows-only FlaUI.Tests project (real UI automation).
  # This is the only leg that can build/test the whole thing; the other two use PolyTerm.Portable.slnx
  # (see its own comment for exactly what's excluded and why).
  windows:
    name: Build & test (windows-latest, full solution)
    runs-on: windows-latest
    if: github.event.action != 'closed'
    # Healthy runs finish in ~7-9 minutes (FlaUI.Tests' real UI automation is the slow part, ~2-3 of
    # that, and runs after the other projects rather than alongside them - see the Test steps). No timeout here defaults to GitHub's own 360-minute cap - fine for cost on GitHub-hosted
    # infra billed by the minute, but this repo runs on a free-tier minute budget, so a single genuinely
    # hung test (confirmed possible: a test that awaits a signal it can only fail to receive, with no
    # fallback cancellation) can silently burn hours before anyone notices. 20 minutes gives ~3x margin
    # over the slowest normal run while capping the damage from a real hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PolyTerm.slnx

      - name: Build
        run: dotnet build PolyTerm.slnx -c Release --no-restore

      # PolyTerm.FlaUI.Tests.KeyboardDiagnosticTests used to be excluded from this run: it drives real
      # OS window focus/keyboard input against a live PolyTerm.exe, and was flaky specifically as part
      # of the full local suite (passed in isolation). Root-caused: PolyTermAppFixture.Dispose() didn't
      # wait for the previous test class's PolyTerm.exe to actually exit before returning, so the next
      # class's fixture could launch and force its own window to the foreground while the previous
      # process/window-close animation was still settling, racing this test's own foreground-forcing.
      # Fixed by waiting for real process exit in Dispose() and reasserting+retrying foreground/typing
      # in the test itself — verified locally with 10 consecutive clean full-suite runs (see
      # https://github.com/pipedream-studios/PolyTerm/issues/3 for the full investigation, including one dead
      # end: simulating an Alt keypress to reset Windows' foreground-lock timeout, which broke this app
      # specifically by triggering a native menu mnemonic). Re-enabled here; if this still flakes on a
      # real GitHub-hosted runner (a materially different environment from local dev), that's the next
      # thing to check — UI-automation tests are a known-harder category on CI generally.
      # dotnet test runs on Microsoft Testing Platform (global.json, #324). Each project writes
      # TestResults/<project>.trx: the .trx options live in tests/Directory.Build.props, because an
      # option on this command line goes to every project in the run, so it can't carry a
      # per-project file name.
      #
      # VncPixelFormatTests re-enabled here (issue #22) after a real fix to FakeRfbServer's drain
      # step (see its own updated comment) — trying this on a real CI run is the only way to actually
      # confirm it, per the issue's own history of inference-from-log-timing-alone going nowhere.
      # --hangdump: PolyTerm.Cli.Tests hung until the job timeout on one scheduled run (and again in
      # #321). This takes a mini dump of a test process stuck for 5 minutes, names the test that was
      # running, and kills it; the dump is uploaded with the test results.
      #
      # PolyTerm.FlaUI.Tests is excluded here and run on its own in the next step (issue #202).
      # `dotnet test` on the solution runs every project in parallel, and FlaUI.Tests drives the real
      # app with synthetic keystrokes and focus changes: on PR #201's first run both of its failures
      # landed while PolyTerm.App.Tests and PolyTerm.Protocols.Ssh.Tests were still running, and every
      # FlaUI test after they finished passed. -p:SkipFlaUITests=true makes dotnet test leave that
      # project out of this run entirely (see its csproj).
      - name: Test (all projects except FlaUI.Tests)
        id: test
        # Issue #221: PolyTerm.App.Tests writes full stacks for unhandled, unobserved and
        # catastrophic-signature exceptions here (UnhandledExceptionDiagnostics); uploaded below.
        env:
          POLYTERM_APP_TESTS_DIAG_DIR: ${{ github.workspace }}/TestResults/app-tests-diag
        run: dotnet test --solution PolyTerm.slnx -c Release --no-restore --no-build -p:SkipFlaUITests=true --results-directory TestResults --hangdump --hangdump-timeout 5m --hangdump-type Mini

      # Runs even when the step above failed, so one red run still reports both sets of results; skipped
      # only when the build itself didn't succeed (or the run was cancelled).
      # A failed FlaUI test saves a screenshot and a UIA tree dump here, named after the test (issue
      # #206, see FailureDiagnostics); the upload step below collects them with the .trx files.
      #
      # --output Detailed puts every test's result in the step log too, as a second record next to
      # the .trx (TestResults/PolyTerm.FlaUI.Tests.trx).
      - name: Test (FlaUI.Tests, on its own)
        id: flaui
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        env:
          POLYTERM_FLAUI_ARTIFACTS_DIR: ${{ github.workspace }}/TestResults/flaui-failures
        run: dotnet test --project tests/PolyTerm.FlaUI.Tests -c Release --no-restore --no-build --output Detailed --results-directory TestResults --hangdump --hangdump-timeout 5m --hangdump-type Mini

      # `dotnet test` exits 0 when a test has no result at all (issue #223), so compare the .trx
      # against the discovered test list and fail on any gap. MTP removed #223's cause, but the check
      # catches any lost result (#303). Runs even if the FlaUI step failed: a missing result is worth
      # reporting alongside a failed one.
      - name: Check every FlaUI test has a result
        if: ${{ !cancelled() && steps.flaui.outcome != 'skipped' }}
        run: ./.github/scripts/Assert-AllTestsReported.ps1 -Project tests/PolyTerm.FlaUI.Tests -TrxPath TestResults/PolyTerm.FlaUI.Tests.trx

      # Same check for every other test project (issue #303). The script maps each .trx back to its
      # project by the test assembly in it.
      - name: Check every other test has a result
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: ./.github/scripts/Assert-AllTestsReported.ps1 -Solution PolyTerm.slnx -ResultsDirectory TestResults -Exclude PolyTerm.FlaUI.Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: |
            TestResults/*.trx
            TestResults/**/*.dmp
            TestResults/flaui-failures/
            TestResults/app-tests-diag/

  # Cross-platform subset — proves PolyTerm.Cli/Engine/the protocol modules (everything except the
  # desktop App itself) actually build and pass their tests on Linux/macOS too, matching the spec's
  # "PolyTerm.Cli can open an SSH session with the App uninstalled" portability litmus test.
  #
  # Split into two jobs, not one matrix job, deliberately: a job-level `if:` can't reference `matrix`
  # (that context only exists within steps, after matrix expansion for that specific combination) -
  # confirmed the hard way, this repo's very first real CI run after re-enabling Actions failed with
  # "Invalid workflow file ... Unrecognized named-value: 'matrix'" from exactly that mistake. Two
  # plain single-OS jobs sidestep the problem entirely and are just as easy to read.
  portable-ubuntu:
    name: Build & test (ubuntu-latest, portable subset)
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    # Healthy runs finish in ~2-3 minutes including the native RDP shim build - see the windows job's
    # own comment on why an explicit cap matters here (free-tier minute budget, not GitHub's default
    # 360-minute one).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # native/PolyTerm-rdp-shim (issue #67) - the FreeRDP C shim PolyTerm.Protocols.RdpFreerdp binds
      # via P/Invoke. The C# build itself doesn't need this (P/Invoke has no compile-time link
      # dependency), but building it for real here catches shim breakage early instead of only ever
      # finding out on a developer's own machine - it's the newest, riskiest code in this repo (first
      # vendored native library / first P/Invoke-to-a-shared-object). freerdp3-dev/libwinpr3-dev
      # install straight from Ubuntu's own apt repo (FreeRDP 3.5.1) - no need to build FreeRDP itself.
      - name: Install native shim build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential cmake freerdp3-dev libwinpr3-dev zlib1g-dev

      - name: Build native RDP shim
        run: |
          cmake -S native/PolyTerm-rdp-shim -B native/PolyTerm-rdp-shim/build
          cmake --build native/PolyTerm-rdp-shim/build

      - name: Restore
        run: dotnet restore PolyTerm.Portable.slnx

      - name: Build
        run: dotnet build PolyTerm.Portable.slnx -c Release --no-restore

      - name: Test
        id: test
        # Issue #221: PolyTerm.App.Tests writes full stacks for unhandled, unobserved and
        # catastrophic-signature exceptions here (UnhandledExceptionDiagnostics); uploaded below.
        env:
          POLYTERM_APP_TESTS_DIAG_DIR: ${{ github.workspace }}/TestResults/app-tests-diag
        run: dotnet test --solution PolyTerm.Portable.slnx -c Release --no-restore --no-build --results-directory TestResults --hangdump --hangdump-timeout 5m --hangdump-type Mini

      # Fail on any discovered test with no result in its project's .trx (issues #223, #303; see the
      # same step in the windows job).
      - name: Check every test has a result
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        shell: pwsh
        run: ./.github/scripts/Assert-AllTestsReported.ps1 -Solution PolyTerm.Portable.slnx -ResultsDirectory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-latest
          path: |
            TestResults/*.trx
            TestResults/**/*.dmp
            TestResults/app-tests-diag/

  # macOS leg of the cross-platform subset, on GitHub-hosted Apple Silicon (macos-15). Standard
  # hosted runners are free for this public repo, run in parallel instead of queueing behind one
  # machine, and match what most real macOS users have. Measured against the old self-hosted Intel
  # Mac (~7-8 min warm): ~2.5 min with the caches below warm, ~7 min fully cold.
  #
  # Both native shims are still built universal (x86_64 + arm64), and the App gets an osx-x64
  # publish as a compile/restore check. Tests themselves run arm64 only.
  portable-macos:
    name: Build & test (macOS arm64, portable subset)
    runs-on: macos-15
    # Fork PRs get this leg too: unlike the self-hosted Mac (issue #211) a hosted runner is a fresh VM
    # thrown away after the job, so a fork can't leave anything behind for the next run.
    if: github.event.action != 'closed'
    # A cold run (cache miss: vcpkg.json or build-native-shims.sh changed) builds FreeRDP + OpenSSL
    # from source for two architectures; that took ~5 min in testing, so this is generous headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Everything build-native-shims.sh keeps between runs: the vcpkg checkout, its bootstrapped tool
      # and the pkgconf build (~/.cache/polyterm), plus vcpkg's binary archives (~/.cache/vcpkg).
      # A fresh VM has none of it, and without this every run rebuilds FreeRDP from source. Keyed on
      # the manifest (pinned builtin-baseline) and the script; restore-keys lets a key change still
      # start from the previous archives, so vcpkg only rebuilds the ports that actually changed.
      - name: Cache vcpkg + native build tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/polyterm
            ~/.cache/vcpkg/archives
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/PolyTerm-rdp-shim/vcpkg.json', 'packaging/macos/build-native-shims.sh') }}
          restore-keys: native-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # Builds native/PolyTerm-pty-shim (resize on macOS - see UnixPtyTerminal.Resize()'s own doc
      # comment) and native/PolyTerm-rdp-shim, both universal. FreeRDP comes from vcpkg rather than
      # Homebrew (which no longer supports Intel Macs, and release.yml's osx-x64 leg runs on one) -
      # see the script's own header for the details.
      - name: Build native shims (universal, FreeRDP via vcpkg)
        run: ./packaging/macos/build-native-shims.sh

      - name: Restore
        run: dotnet restore PolyTerm.Portable.slnx

      - name: Build
        run: dotnet build PolyTerm.Portable.slnx -c Release --no-restore

      # Same --hangdump as the windows job: PolyTerm.Mcp.Tests has hung on macOS before (pipe names
      # past the 104-byte sun_path limit).
      - name: Test
        id: test
        # Issue #221: PolyTerm.App.Tests writes full stacks for unhandled, unobserved and
        # catastrophic-signature exceptions here (UnhandledExceptionDiagnostics); uploaded below.
        env:
          POLYTERM_APP_TESTS_DIAG_DIR: ${{ github.workspace }}/TestResults/app-tests-diag
        run: dotnet test --solution PolyTerm.Portable.slnx -c Release --no-restore --no-build --results-directory TestResults --hangdump --hangdump-timeout 5m --hangdump-type Mini

      # Fail on any discovered test with no result in its project's .trx (issues #223, #303; see the
      # same step in the windows job).
      - name: Check every test has a result
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        shell: pwsh
        run: ./.github/scripts/Assert-AllTestsReported.ps1 -Solution PolyTerm.Portable.slnx -ResultsDirectory TestResults

      # Tests run arm64 only here, so this is as far as Intel coverage goes in CI - it still catches
      # RID-specific restore/publish breakage (native assets, trimming, etc). release.yml's osx-x64
      # leg launch-smoke-tests the real tarball and .dmg on macos-15-intel. After Test, since publishing for
      # another RID re-restores PolyTerm.App.
      - name: Publish App for osx-x64 (compile check)
        run: dotnet publish src/PolyTerm.App/PolyTerm.App.csproj -c Release -r osx-x64 --self-contained true -o "$RUNNER_TEMP/polyterm-osx-x64"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: |
            TestResults/*.trx
            TestResults/**/*.dmp
            TestResults/app-tests-diag/
