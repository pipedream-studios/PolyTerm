# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet packages, centrally managed via Directory.Packages.props at the repo root.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # The default limit is 5. Five stale PRs blocked every run from opening anything new,
    # including the grouped PR that would have superseded them.
    open-pull-requests-limit: 10
    groups:
      # The Avalonia.* packages must stay on the same version, so each release comes in as one
      # PR instead of one per package (which can't be merged one at a time).
      avalonia:
        patterns:
          - "Avalonia*"
      # One .NET release train - the Microsoft.Extensions packages depend on each other, so a
      # partial set (some 10.x, some 11.x) isn't something to merge.
      microsoft:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
          - "System.IO.Ports"
          - "System.Management"
    # Locked to .NET 10.x while the app targets net10.0: these packages ship with each .NET release,
    # so their next major is the next .NET. Patch and minor updates still come through.
    # REMOVE THESE when upgrading to .NET 11 (#251), or Dependabot will never propose 12.x either.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.Ports"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Management"
        update-types: ["version-update:semver-major"]
      # xunit 4.x: PolyTerm.App.Tests is on xunit v3 because Avalonia.Headless.XUnit is built against
      # it, and the runner is shared with the v2 projects. REMOVE THESE when moving to xunit 4 (#265).
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by .github/workflows/ci.yml and release.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
