# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet packages, centrally managed via Directory.Packages.props at the repo root.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Microsoft.Extensions.*/Microsoft.Data.Sqlite follow .NET's own major-version-aligned
      # release cadence (8.x/9.x/10.x), independent of this package's own semver. The whole
      # solution targets net8.0 (global.json/Directory.Build.props) per docs/polyterm-spec.md's
      # own stated policy: "revisit .NET 10 LTS after GA stabilizes" - so a major bump here
      # (e.g. 8.0.x -> 10.0.x) isn't a routine update, it's jumping two full .NET releases ahead
      # of the actual target framework. Cap at semver-major; minor/patch bumps within the 8.x
      # line still come through normally. Doesn't affect Dependabot security updates, which
      # ignore rules never suppress.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by .github/workflows/ci.yml and release.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
