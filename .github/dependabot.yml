# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet packages, centrally managed via Directory.Packages.props at the repo root.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Avalonia.* packages must stay on the same version, so each release comes in as one
      # PR instead of one per package (which can't be merged one at a time).
      avalonia:
        patterns:
          - "Avalonia*"

  # GitHub Actions used by .github/workflows/ci.yml and release.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
